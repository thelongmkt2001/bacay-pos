<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ba Cay POS</title>
<style>
body { font-family: system-ui, sans-serif; margin: 24px; max-width: 900px; }
h1 { font-size: 20px; }
table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
th { background: #f5f5f5; }
.low { background: #ffe9e9; }
button { padding: 4px 10px; cursor: pointer; }
input { width: 60px; padding: 4px; }
#msg { padding: 8px; margin-bottom: 16px; min-height: 20px; }
.ok { background: #e6f7e6; }
.err { background: #ffe9e9; }
</style>
</head>
<body>
<h1>Ba Cay — Ban hang</h1>

<div>
  Cua hang:
  <select id="store"></select>
</div>
<div id="msg"></div>

<table>
  <thead><tr><th>Mon</th><th>Don vi</th><th>Gia</th><th>Ton kho</th><th>SL</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<h1>Don gan day</h1>
<table>
  <thead><tr><th>#</th><th>Cua hang</th><th>Mon</th><th>SL</th><th>Thanh tien</th></tr></thead>
  <tbody id="orders"></tbody>
</table>

<script>
async function load() {
  const stores = await (await fetch('/api/stores')).json();
  const sel = document.getElementById('store');
  if (!sel.options.length) {
    stores.forEach(s => { const o = document.createElement('option'); o.textContent = s; sel.appendChild(o); });
  }

  const ps = await (await fetch('/api/products')).json();
  document.getElementById('rows').innerHTML = ps.map(p => `
    <tr class="${p.stock < 10 ? 'low' : ''}">
      <td>${p.name}</td>
      <td>kg</td>
      <td>${p.price.toLocaleString('vi-VN')}</td>
      <td>${p.stock}</td>
      <td><input type="number" id="q${p.id}" value="1" min="1"></td>
      <td><button onclick="sell(${p.id})">Ban</button></td>
    </tr>`).join('');

  const os = await (await fetch('/api/orders')).json();
  document.getElementById('orders').innerHTML = os.map(o => `
    <tr><td>${o.id}</td><td>${o.store}</td><td>${o.product}</td>
        <td>${o.qty}</td><td>${o.total.toLocaleString('vi-VN')}</td></tr>`).join('');
}

async function sell(id) {
  const qty = parseInt(document.getElementById('q' + id).value);
  const store = document.getElementById('store').value;
  const r = await fetch('/api/orders', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({product_id: id, qty: qty, store: store})
  });
  const j = await r.json();
  const msg = document.getElementById('msg');
  if (j.ok) { msg.className = 'ok'; msg.textContent = 'Da ban. Don #' + j.order_id + ' — ' + j.total.toLocaleString('vi-VN'); }
  else { msg.className = 'err'; msg.textContent = 'Loi: ' + j.error; }
  load();
}

load();
</script>
</body>
</html>
